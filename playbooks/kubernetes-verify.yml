---
- name: Verify Kubernetes cluster
  hosts: k8s_master
  become: true
  gather_facts: false

  tasks:
    - name: Get nodes
      ansible.builtin.command:
        cmd: kubectl get nodes -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: k8s_nodes
      changed_when: false
      check_mode: false

    - name: Show nodes
      ansible.builtin.debug:
        var: k8s_nodes.stdout_lines
    - name: Get all pods
      ansible.builtin.command:
        cmd: kubectl get pods -A -o wide
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: k8s_pods
      changed_when: false
      check_mode: false


    - name: Show pods
      ansible.builtin.debug:
        var: k8s_pods.stdout_lines

    - name: Get Calico status
      ansible.builtin.command:
        cmd: kubectl get tigerastatus
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: calico_status
      changed_when: false
      check_mode: false

    - name: Show Calico status
      ansible.builtin.debug:
        var: calico_status.stdout_lines
