---
- name: Configure MariaDB backup client
  hosts: database
  become: true
  gather_facts: true

  roles:
    - backup_client

- name: Authorize node02 backup key on node06
  hosts: backup
  become: true
  gather_facts: false

  tasks:
    - name: Read node02 backup public key
      ansible.builtin.slurp:
        src: /root/.ssh/backup_ed25519.pub
      delegate_to: node02
      register: node02_backup_key

    - name: Ensure backupsvc ssh directory exists
      ansible.builtin.file:
        path: /home/backupsvc/.ssh
        state: directory
        owner: backupsvc
        group: backupsvc
        mode: "0700"

    - name: Authorize node02 backup key
      ansible.posix.authorized_key:
        user: backupsvc
        key: "{{ node02_backup_key.content | b64decode }}"
        state: present
