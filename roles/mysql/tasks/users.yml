---
# =============================================
# node01 Web
# =============================================

- name: Create web application database user
  ansible.mysql.mysql_user:
    name: webapp
    password: "{{ mysql_webapp_password }}"
    host: "192.168.11.11"
    priv: "web_db.*:ALL"
    state: present
    login_unix_socket: /var/lib/mysql/mysql.sock
  no_log: true

