---
# Backup service account
backup_user: backupsvc
backup_group: backupsvc

# Main backup path
backup_root: /backup

# Backup directories
backup_data_dir: "{{ backup_root }}/data"
backup_log_dir: "{{ backup_root }}/logs"
backup_tmp_dir: "{{ backup_root }}/tmp"
backup_report_dir: "{{ backup_root }}/reports"
backup_manifest_dir: "{{ backup_root }}/manifests"
backup_metadata_dir: "{{ backup_root }}/metadata"

# Nodes whose data will be stored on node06
backup_nodes:
  - node01
  - node02
  - node03
  - node04
  - node05

# Retention policy
backup_daily_retention_days: 7
backup_weekly_retention_days: 28
backup_monthly_retention_days: 180
