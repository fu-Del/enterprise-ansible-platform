---
- name: Deploy nginx main configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Validate nginx configuration
    - Reload nginx


- name: Deploy enterprise application virtual host
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/enterprise-app.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Validate nginx configuration
    - Reload nginx
